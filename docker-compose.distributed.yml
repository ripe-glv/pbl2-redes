services:
  broker:
    build: .
    command: ["python", "broker.py"]
    profiles: ["broker"]
    environment:
      BROKER_ID: ${BROKER_ID:-broker-a}
      SECTOR_ID: ${SECTOR_ID:-area-1-north-route}
      PORT: 8000
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8001}
      PEERS: ${PEERS:-}
      DRONES: ${DRONES:-}
      AREA_X: ${AREA_X:-50}
      AREA_Y: ${AREA_Y:-50}
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-7}
      CLAIM_TTL_SECONDS: ${CLAIM_TTL_SECONDS:-10}
      RETRY_SECONDS: ${RETRY_SECONDS:-3}
      MISSION_TIMEOUT_SECONDS: ${MISSION_TIMEOUT_SECONDS:-20}
    ports:
      - "${BROKER_PORT:-8001}:8000"

  drone:
    build: .
    command: ["python", "drone.py"]
    profiles: ["drone"]
    environment:
      DRONE_ID: ${DRONE_ID:-drone-base-1}
      BASE_ID: ${BASE_ID:-drone-base-1}
      BASE_X: ${BASE_X:-50}
      BASE_Y: ${BASE_Y:-50}
      PORT: 9000
      FAIL_RATE: ${FAIL_RATE:-0.12}
      MIN_MISSION_SECONDS: ${MIN_MISSION_SECONDS:-3}
      MAX_MISSION_SECONDS: ${MAX_MISSION_SECONDS:-8}
    ports:
      - "${DRONE_PORT:-9001}:9000"

  sensor:
    build: .
    command: ["python", "sensor.py"]
    profiles: ["sensor"]
    environment:
      SENSOR_ID: ${SENSOR_ID:-sensor-a-1}
      SECTOR_ID: ${SENSOR_SECTOR_ID:-area-1-north-route}
      BROKER_URL: ${BROKER_URL:-http://127.0.0.1:8001}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-2}

  dashboard:
    build: .
    command: ["python", "-m", "http.server", "8080", "--directory", "/app/dashboard"]
    profiles: ["dashboard"]
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
